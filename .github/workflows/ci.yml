name: CI

# Builds zpaq-std on every supported platform, runs every built-in method there
# (test/ci/platform_check.sh: compress, extract, test), and checks that all the
# platforms write the very same archive bytes (Linux and macOS among themselves,
# Windows among themselves).

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
  workflow_dispatch:

jobs:
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   runner: ubuntu-24.04,     build: 'make -j4', fpc: true }
          - { name: linux-x86,   runner: ubuntu-24.04,     build: 'make -j4 m32', deps: 'g++-multilib' }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, build: 'make -j4', fpc: true }
          # macOS 11 is the first with Apple Silicon: the release binary must run there too
          - { name: macos-arm64, runner: macos-14,         build: 'MACOSX_DEPLOYMENT_TARGET=11.0 make -j3', fpc: true }
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        if: matrix.deps
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.deps }}
      - name: 'Dependencies (macOS: llvm-objcopy)'
        if: runner.os == 'macOS'
        run: brew list llvm >/dev/null 2>&1 || brew install llvm
      - name: Build
        run: ${{ matrix.build }}
      - name: Every method, compress and extract
        run: bash test/ci/platform_check.sh "$PWD/zpaq-std" ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hashes-${{ matrix.name }}
          path: hashes-${{ matrix.name }}.txt
      # the macOS release binary comes from here (no Mac to build it on otherwise)
      - uses: actions/upload-artifact@v4
        with:
          name: zpaq-std-${{ matrix.name }}
          path: zpaq-std
      # the Free Pascal plugins (sylz with sylzec, pja), with the platform's own fpc
      - name: Free Pascal
        if: matrix.fpc
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install fpc; else sudo apt-get update && sudo apt-get install -y fp-compiler; fi
          fpc -iV
      - name: Free Pascal plugins
        if: matrix.fpc
        run: |
          # sylzc.c needs gcc (__builtin_shuffle): on macOS, Homebrew's gcc-14
          ${{ matrix.name == 'macos-arm64' && 'MACOSX_DEPLOYMENT_TARGET=11.0 SYLZC_CC=$(ls /opt/homebrew/bin/gcc-1[0-9] | sort -V | tail -1)' || '' }} make fpc-plugins
          bash test/ci/plugin_check.sh "$PWD/zpaq-std" "$PWD/plugins/codecs" ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: matrix.fpc
        with:
          name: plugins-${{ matrix.name }}
          path: |
            plugins/codecs/sylz.so
            plugins/codecs/pja.so
            plughashes-${{ matrix.name }}.txt

  windows-build:
    name: windows-${{ matrix.arch }} (build)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, prefix: x86_64-w64-mingw32- }
          - { arch: x86, prefix: i686-w64-mingw32- }
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build
        run: make -j4 CROSS_COMPILE=${{ matrix.prefix }}
      - uses: actions/upload-artifact@v4
        with:
          name: zpaq-std-windows-${{ matrix.arch }}
          path: zpaq-std.exe

  windows:
    name: windows-${{ matrix.arch }}
    needs: windows-build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    defaults:
      run:
        shell: bash
    steps:
      # the test tree comes from the checkout: without this, its text files get CRLF
      # here and the archives cannot be compared with the other platforms'
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zpaq-std-windows-${{ matrix.arch }}
          path: bin
      - name: Every method, compress and extract
        run: bash test/ci/platform_check.sh "$PWD/bin/zpaq-std.exe" windows-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hashes-windows-${{ matrix.arch }}
          path: hashes-windows-${{ matrix.arch }}.txt

  same-bytes:
    name: same archive on every platform
    needs: [unix, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hashes-*
          merge-multiple: true
      # On Windows the archive also stores each file's creation and access dates
      # (zpaqfranz's design), so Windows builds are compared with each other
      - name: Linux and macOS, compared with linux-x64
        run: bash test/ci/same_bytes.sh linux-x64 linux-x86 linux-arm64 macos-arm64
      - name: Windows x86, compared with windows-x64
        run: bash test/ci/same_bytes.sh windows-x64 windows-x86
      - uses: actions/download-artifact@v4
        with:
          pattern: plugins-*
          path: plug
      - name: Free Pascal plugins, compared with linux-x64
        run: |
          for p in plug/*/plughashes-*.txt; do cp "$p" "hashes-plug-$(basename "$p" .txt | sed 's/^plughashes-//').txt"; done
          bash test/ci/same_bytes.sh plug-linux-x64 plug-linux-arm64 plug-macos-arm64
